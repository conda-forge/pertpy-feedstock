{% set name = "pertpy" %}
{% set version = "1.1.1" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pertpy-{{ version }}.tar.gz
  sha256: 11e30946f10abfc42722edaf00b06edd15d16465af502dd706538bac59f99924

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - rich
    - scanpy
    - mudata
    - requests
    - scikit-misc
    - adjusttext
    - ott-jax
    - sparsecca
    - openpyxl
    - pubchempy
    - pyarrow
    - blitzgsea
    - scikit-learn >=1.4
    - fast-array-utils
    - arviz >=1.0.0
    - numpyro
    - flax
    - funsor
    - pooch
    - scverse-misc

test:
  imports:
    - pertpy
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://pertpy.readthedocs.io
  summary: Perturbation Analysis in the scverse ecosystem.
  dev_url: https://github.com/scverse/pertpy
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mschilli87
    - Zethson
